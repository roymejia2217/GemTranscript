[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gemtranscript"
version = "1.0.0"
description = "GemTranscript - A GUI and CLI tool for transcribing media files using Gemini AI"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "google-genai>=0.3.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.0.0",
]

[project.scripts]
gemtranscript = "main:main"
gemtranscript-gui = "gui:main"
